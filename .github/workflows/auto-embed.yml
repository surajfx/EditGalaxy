name: Auto Embed & Share Pages

# Ei workflow ta:
#   - Protii 30 minute-e nijei chole (cron schedule)
#   - Chaile "Actions" tab theke manually o run kora jai
#
# Kaj: Firebase Realtime Database theke sob template+prompt data fetch
# kore, index.html-er bhitore SORASORI bosiye dei (zero-loading), ar
# protita template/prompt-er jonno alada static share page banai
# (WhatsApp/Instagram-e sothik thumbnail preview-r jonno), tarpor
# nijei GitHub-e commit+push kore dei.
#
# Admin Panel theke template/prompt upload korar por r kichu korte
# hobe na - shudhu wait korte hobe (max 30 minute) ba Actions tab
# theke manually "Run workflow" chapte paren.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  embed-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Repo checkout kori
        uses: actions/checkout@v4

      - name: Node.js setup kori
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Dependencies install kori
        run: npm install firebase-admin

      - name: Firebase service account key file banai (GitHub Secret theke)
        run: echo "${{ secrets.EDITGALAXY_FIREBASE_SERVICE_ACCOUNT }}" | base64 -d > serviceAccountKey.json

      - name: Template + Prompt data index.html-e embed kori
        run: node generate-index.js

      - name: Protita template/prompt-er static share page generate kori
        run: node generate-share-pages.js

      - name: Notun share page-gulo main folder-e copy kori
        run: |
          mkdir -p template prompt
          cp -r output/template/* ./template/ 2>/dev/null || true
          cp -r output/prompt/* ./prompt/ 2>/dev/null || true
          cp output/sitemap-items.xml ./sitemap-items.xml 2>/dev/null || true

      - name: Change ache ki check kori, thakle commit+push kori
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html template/ prompt/ sitemap-items.xml
          if git diff --cached --quiet; then
            echo "Kono notun data nei, deploy korar dorkar nei."
          else
            git commit -m "Auto: data embed + share pages update ($(date '+%Y-%m-%d %H:%M UTC'))"
            git push
          fi

      - name: Service account key file muchi (security-r jonno)
        if: always()
        run: rm -f serviceAccountKey.json
        
