<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>EditGalaxy Bulk Upload v17</title><style>*{box-sizing:border-box}body{margin:0;background:#080a12;color:#fff;font-family:Arial,sans-serif;padding:18px}.wrap{max-width:850px;margin:auto}.box{background:#111522;border:1px solid rgba(255,255,255,.09);border-radius:18px;padding:18px;margin-bottom:14px}.input{width:100%;background:#0a0d15;color:#fff;border:1px solid rgba(255,255,255,.1);border-radius:11px;padding:12px;margin:7px 0}.btn{width:100%;padding:13px;border:0;border-radius:12px;background:linear-gradient(135deg,#8b5cf6,#ec4899,#f97316);color:#fff;font-weight:800}.stat{display:flex;justify-content:space-between;color:#aab3c7;font-size:13px;margin:5px 0}.progress{height:8px;background:#1a1e2b;border-radius:99px;overflow:hidden;margin:14px 0}.bar{height:100%;width:0;background:linear-gradient(90deg,#8b5cf6,#ec4899);transition:.2s}.ta{width:100%;min-height:180px;background:#090b10;color:#fff;border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:12px;font-family:monospace;font-size:12px}.hide{display:none}.ok{color:#57e389}.err{color:#ff7373}</style></head><body><div class="wrap"><div id="login" class="box"><h2>🔐 Bulk Upload Login</h2><input class="input" id="email" type="email" placeholder="Admin email"><input class="input" id="password" type="password" placeholder="Password"><button class="btn" onclick="login()">Login</button><div id="loginMsg"></div></div><div id="app" class="hide"><div class="box"><h2>🚀 Bulk Template Uploader v17</h2><p style="color:#aab3c7">Only a number that has BOTH a CapCut link and an Instagram link is uploaded. Missing numbers are skipped automatically.</p><div class="stat"><span>Total parsed</span><b id="total">0</b></div><div class="stat"><span>Matched / ready</span><b id="ready">0</b></div><div class="stat"><span>Uploaded</span><b id="done">0</b></div><div class="stat"><span>Skipped / missing</span><b id="skip">0</b></div><div class="stat"><span>Failed</span><b id="fail">0</b></div><div class="progress"><div id="bar" class="bar"></div></div><button class="btn" id="start" onclick="startUpload()">⚡ Match & Upload</button></div><div class="box"><h3>Template list</h3><textarea id="tpl" class="ta" placeholder="Template #401\nhttps://capcut...\nTemplate #400\n..."></textarea><h3>Instagram list</h3><textarea id="ig" class="ta" placeholder="Instagram - 400\nhttps://www.instagram.com/reel/...\nInstagram - 399\n..."></textarea><button class="btn" style="margin-top:10px" onclick="preview()">Match & Preview</button><div id="preview" style="margin-top:12px"></div></div><div class="box"><div id="log" class="ta" style="min-height:120px;white-space:pre-wrap"></div></div><button class="btn" style="background:#1b1f2c" onclick="logout()">Logout</button></div></div><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";import{getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";import{getDatabase,ref,push,get,query,orderByChild,equalTo}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";const cfg={apiKey:"AIzaSyBgPllgUNMUo6j_Rbd7wg0NjR6z4YFy6uU",authDomain:"template-cc1cb.firebaseapp.com",databaseURL:"https://template-cc1cb-default-rtdb.firebaseio.com",projectId:"template-cc1cb",storageBucket:"template-cc1cb.firebasestorage.app",messagingSenderId:"629554966666",appId:"1:629554966666:web:e99b4dda5170da00a845d3"};const app=initializeApp(cfg),auth=getAuth(app),db=getDatabase(app);let ready=[];function el(id){return document.getElementById(id)}window.login=async()=>{try{await signInWithEmailAndPassword(auth,el('email').value.trim(),el('password').value);el('loginMsg').textContent=''}catch(e){el('loginMsg').textContent='Login failed';el('loginMsg').className='err'}};window.logout=()=>signOut(auth);onAuthStateChanged(auth,u=>{el('login').classList.toggle('hide',!!u);el('app').classList.toggle('hide',!u)});
function parseList(text,type){const lines=text.split(/\r?\n/).map(x=>x.trim()).filter(Boolean),out={};let n=null;for(const line of lines){const m=line.match(/(?:template|instagram)\s*[-#]?\s*(\d+)/i)||line.match(/^#?\s*(\d+)$/);if(m){n=Number(m[1]);continue}if(/^https?:\/\//i.test(line)&&n!==null){out[n]=line;n=null}}return out}
function build(){const c=parseList(el('tpl').value,'t'),i=parseList(el('ig').value,'i');const nums=[...new Set(Object.keys(c).map(Number).filter(n=>i[n]))].sort((a,b)=>b-a);return nums.map(n=>({num:n,capcut:c[n],video:i[n],instagramUrl:i[n],category:'trending',cat:'trending',addedAt:Date.now()}))}
window.preview=async()=>{const c=parseList(el('tpl').value),i=parseList(el('ig').value),all=[...new Set([...Object.keys(c),...Object.keys(i)].map(Number))].sort((a,b)=>b-a),arr=build();ready=arr;el('total').textContent=all.length;el('ready').textContent=arr.length;el('skip').textContent=all.length-arr.length;el('preview').innerHTML=arr.slice(0,20).map(x=>`<div>#${x.num} ✓</div>`).join('')+(arr.length>20?`<div>…and ${arr.length-20} more</div>`:'')};window.startUpload=async()=>{if(!auth.currentUser){alert('Login first');return}if(!ready.length)await preview();const b=el('start');b.disabled=true;let done=0,fail=0;for(const x of ready){try{const q=query(ref(db,'templates'),orderByChild('num'),equalTo(x.num));const s=await get(q);if(s.exists()){el('log').textContent+=`SKIP #${x.num} — already exists\n`;continue}await push(ref(db,'templates'),x);done++;el('done').textContent=done}catch(e){fail++;el('fail').textContent=fail;el('log').textContent+=`FAIL #${x.num}: ${e.message}\n`}el('bar').style.width=Math.round((done+fail)/ready.length*100)+'%'}b.disabled=false;el('log').textContent+=`\nFinished: ${done} uploaded, ${fail} failed.`};</script></body></html>
