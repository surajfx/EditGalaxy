<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>EditGalaxy Admin v17</title><style>
*{box-sizing:border-box}body{margin:0;background:#070811;color:#fff;font-family:Arial,sans-serif}button,input,textarea,select{font:inherit}.wrap{max-width:980px;margin:auto;padding:18px 14px 60px}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.box,.section{background:#10131e;border:1px solid rgba(255,255,255,.09);border-radius:20px;padding:20px;margin-bottom:16px}.login .box{width:min(400px,100%);text-align:center}.brand{font-size:27px;font-weight:900;margin-bottom:7px}.muted{color:#aab3c7;font-size:13px;line-height:1.5}.input,.select,.textarea{width:100%;background:#0b0e17;border:1px solid rgba(255,255,255,.1);border-radius:12px;color:#fff;padding:13px;margin:7px 0;outline:0}.textarea{min-height:150px;resize:vertical}.btn{border:0;border-radius:12px;padding:13px 18px;font-weight:800;cursor:pointer;background:linear-gradient(135deg,#8b5cf6,#ec4899,#f97316);color:#fff}.btn.secondary{background:#191d2a;border:1px solid rgba(255,255,255,.1)}.btn:disabled{opacity:.5}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:15px}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:15px}.tab{padding:11px 15px;border:1px solid rgba(255,255,255,.1);border-radius:12px;white-space:nowrap;cursor:pointer}.tab.active{background:rgba(125,220,255,.1);border-color:rgba(125,220,255,.35)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}.count{text-align:right;color:#8f9ab2;font-size:11px}.list{display:grid;gap:9px}.item{display:flex;gap:10px;align-items:center;background:#0b0e17;border:1px solid rgba(255,255,255,.07);padding:10px;border-radius:13px}.item .n{font-weight:900;min-width:55px}.item .info{flex:1;min-width:0}.item .title{font-weight:800;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item .sub{font-size:11px;color:#8f9ab2;margin-top:3px}.row{display:flex;gap:8px;flex-wrap:wrap}.danger{background:#32151a}.success{color:#55e28a}.error{color:#ff7777}.preview{width:100%;max-height:220px;object-fit:contain;border-radius:12px;background:#080a10;display:none}.char{color:#8f9ab2;font-size:11px;text-align:right}.hide{display:none}.spinner{display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:s .7s linear infinite}@keyframes s{to{transform:rotate(360deg)}}@media(max-width:650px){.grid2{grid-template-columns:1fr}.full{grid-column:auto}.wrap{padding:12px 10px 50px}.section{padding:15px}.top{align-items:flex-start}.item{align-items:flex-start}}
</style></head><body><div id="login" class="login"><div class="box"><div class="brand">⚡ EditGalaxy Admin</div><div class="muted">Secure Firebase login. No password is stored in this page.</div><input class="input" id="email" type="email" autocomplete="username" placeholder="Email"><input class="input" id="password" type="password" autocomplete="current-password" placeholder="Password" onkeydown="if(event.key==='Enter')login()"><button class="btn" style="width:100%;margin-top:7px" onclick="login()">Login</button><div id="loginMsg" class="error" style="margin-top:9px"></div></div></div>
<div id="app" class="wrap hide"><div class="top"><div><h2 style="margin:0">⚡ EditGalaxy Admin</h2><div class="muted">Manage templates, prompts and content.</div></div><button class="btn secondary" onclick="logout()">Logout</button></div><div class="tabs"><button class="tab active" id="tabT" onclick="switchTab('templates')">🎬 Templates</button><button class="tab" id="tabP" onclick="switchTab('prompts')">🖼️ Prompts</button></div>
<section id="templates" class="section"><h3>Add New Template</h3><div class="grid2"><div><label>Template #</label><input class="input" id="tnum" type="number" inputmode="numeric" placeholder="401"></div><div><label>Template Name</label><input class="input" id="tname" maxlength="100" placeholder="Optional"></div><div><label>Category</label><select class="select" id="tcat"><option value="trending">🔥 Trending</option><option value="cinematic">🎬 Cinematic</option><option value="hindi">🇮🇳 Hindi</option><option value="english">🇬🇧 English</option><option value="funk">🎵 Funk</option></select></div><div><label>Instagram Video Link *</label><input class="input" id="tvideo" type="url" placeholder="https://www.instagram.com/reel/..."></div><div class="full"><label>CapCut Template Link *</label><input class="input" id="tcapcut" type="url" placeholder="https://capcut-yt.onelink.me/..."></div><div class="full"><label>Preview Image Link (optional)</label><input class="input" id="timage" type="url" placeholder="Add later if you want"></div><div class="full"><label>How-to-Use Video Link (optional)</label><input class="input" id="thow" type="url"></div></div><div class="row" style="margin-top:10px"><button class="btn" onclick="addTemplate()">＋ Add Template</button><span id="tmsg" class="muted"></span></div></section>
<section id="prompts" class="section hide"><h3>Add New Prompt</h3><div><label>Preview Image (optional)</label><input class="input" id="pimage" type="url" placeholder="You can add the thumbnail later"></div><div><label>Prompt Title (max 100)</label><input class="input" id="ptitle" maxlength="100" oninput="pc('ptitle','ptc',100)" placeholder="e.g. Cinematic Birthday Portrait"><div class="char"><span id="ptc">0</span>/100</div></div><div><label>👩 Girl Version Prompt (max 3000)</label><textarea class="textarea" id="pgirl" maxlength="3000" oninput="pc('pgirl','pgc',3000)" placeholder="Enter girl version prompt..."></textarea><div class="char"><span id="pgc">0</span>/3000</div></div><div><label>👨 Boy Version Prompt (max 3000)</label><textarea class="textarea" id="pboy" maxlength="3000" oninput="pc('pboy','pbc',3000)" placeholder="Enter boy version prompt..."></textarea><div class="char"><span id="pbc">0</span>/3000</div></div><div><label>Category</label><select class="select" id="pcat"><option value="cinematic">🎬 Cinematic</option><option value="4k">✨ 4K Image</option><option value="anime">🌸 Anime</option><option value="portrait">👤 Portrait</option><option value="fantasy">🔮 Fantasy</option><option value="static">📸 Static</option></select></div><div><label>Tips (optional)</label><textarea class="textarea" id="ptips" style="min-height:80px" maxlength="90" placeholder="This prompt works best with ChatGPT..."></textarea></div><div class="row"><button class="btn" onclick="addPrompt()">＋ Publish Prompt</button><span id="pmsg" class="muted"></span></div></section>
<section class="section"><div class="top"><h3 style="margin:0">Manage</h3><div id="manageCount" class="count"></div></div><div id="manageList" class="list"></div></section></div>
<script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";import{getDatabase,ref,push,set,remove,onValue}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
const cfg={apiKey:"AIzaSyBgPllgUNMUo6j_Rbd7wg0NjR6z4YFy6uU",authDomain:"template-cc1cb.firebaseapp.com",databaseURL:"https://template-cc1cb-default-rtdb.firebaseio.com",projectId:"template-cc1cb",storageBucket:"template-cc1cb.firebasestorage.app",messagingSenderId:"629554966666",appId:"1:629554966666:web:e99b4dda5170da00a845d3"};const app=initializeApp(cfg),auth=getAuth(app),db=getDatabase(app);let mode='templates',itemsT=[],itemsP=[];
function el(id){return document.getElementById(id)}function msg(id,text,ok=false){el(id).textContent=text;el(id).className=ok?'success':'error'}window.pc=(a,b,max)=>el(b).textContent=Math.min(el(a).value.length,max);
window.login=async()=>{msg('loginMsg','');try{await signInWithEmailAndPassword(auth,el('email').value.trim(),el('password').value)}catch(e){msg('loginMsg','Login failed. Check email/password.')}};window.logout=()=>signOut(auth);onAuthStateChanged(auth,u=>{el('login').classList.toggle('hide',!!u);el('app').classList.toggle('hide',!u);if(u)loadAll()});
function loadAll(){onValue(ref(db,'templates'),s=>{itemsT=Object.entries(s.val()||{}).map(([id,x])=>({id,...x}));renderManage()});onValue(ref(db,'prompts'),s=>{itemsP=Object.entries(s.val()||{}).map(([id,x])=>({id,...x}));renderManage()})}
window.switchTab=m=>{mode=m;el('templates').classList.toggle('hide',m!=='templates');el('prompts').classList.toggle('hide',m!=='prompts');el('tabT').classList.toggle('active',m==='templates');el('tabP').classList.toggle('active',m==='prompts');renderManage()};
window.addTemplate=async()=>{const num=Number(el('tnum').value),name=el('tname').value.trim(),video=el('tvideo').value.trim(),capcut=el('tcapcut').value.trim();if(!num||!video||!capcut){msg('tmsg','Number, Instagram link and CapCut link are required.');return}try{await push(ref(db,'templates'),{num,name,video,instagramUrl:video,capcut,imageUrl:el('timage').value.trim(),howto:el('thow').value.trim(),category:el('tcat').value,cat:el('tcat').value,addedAt:Date.now()});['tnum','tname','tvideo','tcapcut','timage','thow'].forEach(id=>el(id).value='');msg('tmsg','Added ✓',true)}catch(e){msg('tmsg',e.message)}};
window.addPrompt=async()=>{const title=el('ptitle').value.trim(),girl=el('pgirl').value.trim(),boy=el('pboy').value.trim();if(!title||!girl||!boy){msg('pmsg','Title, Girl prompt and Boy prompt are required.');return}try{await push(ref(db,'prompts'),{title,girlPrompt:girl,boyPrompt:boy,imageUrl:el('pimage').value.trim(),tips:el('ptips').value.trim(),category:el('pcat').value,createdAt:Date.now()});['ptitle','pgirl','pboy','pimage','ptips'].forEach(id=>el(id).value='');['ptc','pgc','pbc'].forEach(id=>el(id).textContent='0');msg('pmsg','Published ✓',true)}catch(e){msg('pmsg',e.message)}};
window.del=async(type,id)=>{if(!confirm('Delete this item?'))return;await remove(ref(db,`${type}/${id}`))};function renderManage(){const arr=(mode==='templates'?itemsT:itemsP).sort((a,b)=>Number(b.num||0)-Number(a.num||0)||Number(b.createdAt||b.addedAt||0)-Number(a.createdAt||a.addedAt||0));el('manageCount').textContent=`${arr.length} items`;el('manageList').innerHTML=arr.length?arr.map(x=>`<div class="item"><div class="n">#${x.num||'—'}</div><div class="info"><div class="title">${safe(x.title||x.name||'Untitled')}</div><div class="sub">${safe(x.category||x.cat||'General')}</div></div><button class="btn secondary" onclick="del('${mode}', '${x.id}')">Delete</button></div>`).join(''):'<div class="muted">No items yet.</div>'}function safe(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
</script></body></html>
