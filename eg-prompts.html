<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Prompts — EditGalaxy</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#06060f;--surface:rgba(255,255,255,.04);--surface-h:rgba(255,255,255,.08);
  --border:rgba(255,255,255,.08);--purple:#a855f7;--pink:#ec4899;--orange:#f97316;
  --text:#f8fafc;--muted:#94a3b8;
  --grad:linear-gradient(135deg,#a855f7,#ec4899,#f97316);
  --grad-card:linear-gradient(160deg,rgba(168,85,247,.12) 0%,rgba(236,72,153,.06) 100%);
  --r:18px;--card-bg:rgba(255,255,255,.03);--nav-bg:rgba(8,8,16,.9);--ctrl-bg:rgba(20,18,30,.6);
}
[data-theme="light"]{
  --bg:#F8F9FC;--surface:rgba(120,110,140,.055);--surface-h:rgba(120,110,140,.09);
  --border:rgba(30,25,50,.08);--purple:#8b5cf6;--pink:#db2777;--orange:#ea580c;
  --text:#1a1625;--muted:#6b6478;
  --grad:linear-gradient(135deg,#8b5cf6,#db2777,#ea580c);
  --grad-card:linear-gradient(160deg,rgba(139,92,246,.035) 0%,rgba(219,39,119,.02) 100%);
  --card-bg:rgba(255,255,255,.7);--nav-bg:rgba(255,255,255,.75);--ctrl-bg:rgba(255,255,255,.55);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;overflow-x:hidden;transition:background .4s ease,color .4s ease}

nav{position:fixed;top:0;left:0;right:0;z-index:200;background:var(--nav-bg);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;justify-content:space-between}
.nav-logo{font-family:'Syne',sans-serif;font-weight:800;font-size:20px;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-decoration:none;display:flex;align-items:center;gap:8px}
.nav-logo .spark{-webkit-text-fill-color:initial}
.back-btn,.icon-btn{width:38px;height:38px;border-radius:100px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none;color:var(--text);font-size:16px}

.wrap{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:80px 16px 60px}

.ctrl{position:sticky;top:72px;z-index:50;background:var(--ctrl-bg);backdrop-filter:blur(24px) saturate(200%);border:1px solid var(--border);border-radius:28px;margin:8px 0 24px;padding:12px 14px;box-shadow:0 8px 32px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.1)}
[data-theme="light"] .ctrl{box-shadow:0 8px 28px rgba(30,20,60,.06),inset 0 1px 0 rgba(255,255,255,.6)}
.sw{position:relative;margin-bottom:10px}
.si-ico{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:15px}
#searchInput{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:100px;padding:15px 16px 15px 44px;color:var(--text);font-size:14px;outline:none}
#searchInput::placeholder{color:var(--muted)}
#searchInput:focus{border-color:rgba(168,85,247,.6);box-shadow:0 0 0 3px rgba(168,85,247,.15)}
.filters{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px}
.filters::-webkit-scrollbar{display:none}
.fb{background:var(--surface);border:1px solid var(--border);color:var(--muted);font-family:'Syne',sans-serif;font-size:12px;font-weight:600;padding:8px 15px;border-radius:100px;cursor:pointer;white-space:nowrap;flex-shrink:0}
.fb.active{background:var(--grad);border-color:transparent;color:#fff}

.sh{display:flex;align-items:center;justify-content:space-between;margin:20px 0 16px}
.st{font-family:'Syne',sans-serif;font-size:17px;font-weight:700}
.sc{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--border);padding:4px 12px;border-radius:100px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
@media(min-width:600px){.grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}}
.card{background:var(--grad-card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:transform .3s cubic-bezier(.34,1.56,.64,1),box-shadow .3s;position:relative}
.card:hover{transform:translateY(-4px);box-shadow:0 16px 40px rgba(0,0,0,.4)}
[data-theme="light"] .card{background:var(--card-bg);box-shadow:0 2px 12px rgba(30,20,60,.05)}
.card-img{width:100%;aspect-ratio:3/4;object-fit:cover;background:var(--surface)}
.card-tag{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);color:#fff;font-size:10px;font-weight:700;padding:4px 10px;border-radius:100px;text-transform:capitalize}
[data-theme="light"] .card-tag{background:rgba(255,255,255,.85);color:#333}
.card-body{padding:10px 12px}
.card-title{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* DETAIL OVERLAY */
.detail-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);z-index:500;display:none;align-items:flex-end;justify-content:center}
.detail-overlay.open{display:flex}
.detail-sheet{background:var(--bg);width:100%;max-width:600px;max-height:92vh;border-radius:24px 24px 0 0;overflow-y:auto;padding:0 0 30px;animation:slideUp .3s cubic-bezier(.16,1,.3,1)}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet-drag{width:40px;height:4px;background:var(--border);border-radius:100px;margin:12px auto}
.sheet-close{position:absolute;top:16px;right:16px;width:34px;height:34px;border-radius:100px;background:rgba(0,0,0,.5);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2}
.detail-img{width:100%;aspect-ratio:1/1;object-fit:cover}
.detail-body{padding:18px}
.detail-cat{display:inline-block;background:var(--surface);color:var(--purple);font-size:11px;font-weight:700;padding:5px 12px;border-radius:100px;margin-bottom:10px}
.detail-title{font-family:'Syne',sans-serif;font-size:20px;font-weight:700;margin-bottom:16px}
.prompt-box{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px}
.prompt-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;margin-bottom:8px}
.prompt-text{font-size:13px;line-height:1.6;color:var(--text);max-height:150px;overflow-y:auto;margin-bottom:10px}
.copy-btn{width:100%;background:var(--grad);color:#fff;font-family:'Syne',sans-serif;font-weight:700;font-size:13px;padding:11px;border-radius:100px;border:none;cursor:pointer}
.detail-actions{display:flex;gap:10px;margin-top:16px}
.detail-actions button{flex:1;background:var(--surface);border:1px solid var(--border);color:var(--text);font-size:13px;font-weight:600;padding:12px;border-radius:100px;cursor:pointer}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--grad);color:#fff;padding:12px 22px;border-radius:100px;font-size:13px;font-weight:600;z-index:999;transition:transform .3s cubic-bezier(.34,1.56,.64,1);box-shadow:0 10px 30px rgba(168,85,247,.4)}
.toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<script>
(function(){
  const saved = localStorage.getItem('eg_theme') || 'dark';
  if(saved === 'light') document.documentElement.setAttribute('data-theme', 'light');
})();
</script>

<nav>
  <a href="index.html" class="back-btn">←</a>
  <a href="index.html" class="nav-logo"><span class="spark">✨</span> EditGalaxy</a>
  <button class="icon-btn" id="themeToggle" onclick="toggleTheme()">🌙</button>
</nav>

<div class="wrap">
  <div class="ctrl">
    <div class="sw">
      <span class="si-ico">🔍</span>
      <input type="text" id="searchInput" placeholder="Search prompts by name, style...">
    </div>
    <div class="filters" id="filterBar">
      <button class="fb active" data-f="all">All</button>
      <button class="fb" data-f="trending">🔥 Trending</button>
      <button class="fb" data-f="cinematic">🎬 Cinematic</button>
      <button class="fb" data-f="4k">✨ 4K</button>
      <button class="fb" data-f="anime">🌸 Anime</button>
      <button class="fb" data-f="portrait">👤 Portrait</button>
      <button class="fb" data-f="fantasy">🔮 Fantasy</button>
      <button class="fb" data-f="static">📸 Static</button>
    </div>
  </div>

  <div class="sh">
    <div class="st" id="stitle">✨ All Prompts</div>
    <div class="sc" id="scount">Loading...</div>
  </div>
  <div class="grid" id="grid">
    <div style="grid-column:1/-1;text-align:center;padding:50px 20px;color:var(--muted)">Loading prompts...</div>
  </div>
</div>

<div class="detail-overlay" id="detailOverlay">
  <div class="detail-sheet">
    <div class="sheet-close" id="closeDetail">✕</div>
    <img class="detail-img" id="detailImg" src="">
    <div class="detail-body">
      <span class="detail-cat" id="detailCat"></span>
      <div class="detail-title" id="detailTitle"></div>

      <div class="prompt-box" id="girlBox" style="display:none">
        <div class="prompt-label">👩 Girl Version</div>
        <div class="prompt-text" id="girlText"></div>
        <button class="copy-btn" id="copyGirlBtn">📋 Copy Prompt</button>
      </div>

      <div class="prompt-box" id="boyBox" style="display:none">
        <div class="prompt-label">👨 Boy Version</div>
        <div class="prompt-text" id="boyText"></div>
        <button class="copy-btn" id="copyBoyBtn">📋 Copy Prompt</button>
      </div>

      <div class="detail-actions">
        <button id="shareBtn">🔗 Share</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast">Copied!</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
// Prompt Galaxy's Firestore (shared prompt database)
firebase.initializeApp({
  apiKey: "AIzaSyDhH_fplGM0SYhXYQyGEmSgsxchuUgi43I",
  authDomain: "surajfx2.firebaseapp.com",
  projectId: "surajfx2",
  storageBucket: "surajfx2.firebasestorage.app",
  messagingSenderId: "386646596801",
  appId: "1:386646596801:web:18bbb81f9d65ab79b28840"
});
const db = firebase.firestore();

let allPrompts = [];
let currentPrompt = null;
const grid = document.getElementById('grid');
const scount = document.getElementById('scount');
const stitle = document.getElementById('stitle');
const inp = document.getElementById('searchInput');
let activeFilter = 'all';

const PH = 'data:image/svg+xml,' + encodeURIComponent(`
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="240"><rect width="200" height="240" fill="#151020"/></svg>`);

function makeCard(p){
  return `
  <div class="card" data-id="${p.id}">
    <img class="card-img" src="${p.imageUrl || PH}" loading="lazy" onerror="this.onerror=null;this.src='${PH}'">
    <div class="card-tag">${p.category || 'prompt'}</div>
    <div class="card-body"><div class="card-title">${p.title || 'Untitled'}</div></div>
  </div>`;
}

function renderGrid(list){
  if(!list.length){
    grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:50px 20px;color:var(--muted)">No prompts found</div>';
    scount.textContent = '0 prompts';
    return;
  }
  grid.innerHTML = list.map(makeCard).join('');
  scount.textContent = list.length + ' prompts';
  grid.querySelectorAll('.card').forEach(c=>{
    c.addEventListener('click', ()=> openDetail(c.dataset.id));
  });
}

function doFilter(){
  const raw = inp.value.toLowerCase().trim();
  let filtered = allPrompts.filter(p=>{
    const matchCat = activeFilter==='all' || (p.category||'').toLowerCase()===activeFilter;
    const matchS = raw==='' || [p.title,p.girlPrompt,p.boyPrompt,p.category].some(f=>(f||'').toLowerCase().includes(raw));
    return matchCat && matchS;
  });
  renderGrid(filtered);
}

inp.addEventListener('input', doFilter);
document.querySelectorAll('.fb').forEach(b=>{
  b.addEventListener('click', ()=>{
    document.querySelectorAll('.fb').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    activeFilter = b.dataset.f;
    stitle.textContent = activeFilter==='all' ? '✨ All Prompts' : '✨ ' + b.textContent.trim();
    doFilter();
  });
});

function openDetail(id){
  const p = allPrompts.find(x=>x.id===id);
  if(!p) return;
  currentPrompt = p;

  document.getElementById('detailCat').textContent = p.category || 'Prompt';
  document.getElementById('detailTitle').textContent = p.title || 'Untitled';
  document.getElementById('detailImg').src = p.imageUrl || PH;

  const girlBox = document.getElementById('girlBox');
  const boyBox = document.getElementById('boyBox');
  if(p.girlPrompt){ girlBox.style.display='block'; document.getElementById('girlText').textContent = p.girlPrompt; }
  else girlBox.style.display='none';
  if(p.boyPrompt){ boyBox.style.display='block'; document.getElementById('boyText').textContent = p.boyPrompt; }
  else boyBox.style.display='none';

  document.getElementById('detailOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeDetail(){
  document.getElementById('detailOverlay').classList.remove('open');
  document.body.style.overflow = '';
}
document.getElementById('closeDetail').addEventListener('click', closeDetail);
document.getElementById('detailOverlay').addEventListener('click', e=>{
  if(e.target.id === 'detailOverlay') closeDetail();
});

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

document.getElementById('copyGirlBtn').addEventListener('click', async ()=>{
  try{ await navigator.clipboard.writeText(currentPrompt.girlPrompt||''); showToast('Prompt copied! 📋'); }catch(e){}
});
document.getElementById('copyBoyBtn').addEventListener('click', async ()=>{
  try{ await navigator.clipboard.writeText(currentPrompt.boyPrompt||''); showToast('Prompt copied! 📋'); }catch(e){}
});
document.getElementById('shareBtn').addEventListener('click', async ()=>{
  const url = window.location.href.split('?')[0] + '?p=' + currentPrompt.id;
  if(navigator.share){
    try{ await navigator.share({title: currentPrompt.title, url}); }catch(e){}
  } else {
    try{ await navigator.clipboard.writeText(url); showToast('Link copied! 🔗'); }catch(e){}
  }
});

function loadPrompts(){
  db.collection('prompts').get().then(snap=>{
    allPrompts = [];
    snap.forEach(doc=>{
      allPrompts.push({id: doc.id, ...doc.data()});
    });
    doFilter();
  }).catch(err=>{
    grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:50px 20px;color:var(--muted)">Could not load prompts</div>';
    console.error(err);
  });
}
loadPrompts();

function toggleTheme(){
  const html = document.documentElement;
  const btn = document.getElementById('themeToggle');
  const isLight = html.getAttribute('data-theme') === 'light';
  if(isLight){
    html.removeAttribute('data-theme');
    localStorage.setItem('eg_theme', 'dark');
    if(btn) btn.textContent = '🌙';
  } else {
    html.setAttribute('data-theme', 'light');
    localStorage.setItem('eg_theme', 'light');
    if(btn) btn.textContent = '☀️';
  }
}
(function(){
  const btn = document.getElementById('themeToggle');
  if(btn && document.documentElement.getAttribute('data-theme') === 'light') btn.textContent = '☀️';
})();
</script>
</body>
</html>
